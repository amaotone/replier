name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    name: Build and Release
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Build app
        run: Scripts/build-app.sh

      - name: Verify version matches tag
        run: |
          set -euo pipefail
          expected_version="${GITHUB_REF_NAME#v}"
          built_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/Replier.app/Contents/Info.plist)"
          echo "tag=${GITHUB_REF_NAME} expected_version=${expected_version} built_version=${built_version}"
          if [ "$built_version" != "$expected_version" ]; then
            echo "error: built app version ($built_version) does not match tag (${GITHUB_REF_NAME})" >&2
            exit 1
          fi

      - name: Create zip archive
        run: ditto -c -k --keepParent dist/Replier.app "Replier-${GITHUB_REF_NAME}.zip"

      - name: Create DMG
        run: Scripts/make-dmg.sh "Replier-${GITHUB_REF_NAME}.dmg"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="## インストール方法

          1. \`Replier-${GITHUB_REF_NAME}.dmg\` をダウンロードして開き、\`Replier.app\` を \`Applications\` へドラッグ(zip でも可)
          2. 初回起動時は Gatekeeper 警告が出るため、Finder で Replier.app を右クリック(または Control+クリック)して「開く」を選択(またはターミナルで \`xattr -cr /Applications/Replier.app\`)
          3. 起動後のオンボーディングでアクセシビリティ権限を許可
          4. 動作には [Codex CLI](https://developers.openai.com/codex) のインストールとログイン(ChatGPT サブスクまたは API キー)が必要"
          gh release create "${GITHUB_REF_NAME}" \
            --title "Replier ${GITHUB_REF_NAME}" \
            --notes "$NOTES" \
            --generate-notes \
            "Replier-${GITHUB_REF_NAME}.zip" \
            "Replier-${GITHUB_REF_NAME}.dmg"
